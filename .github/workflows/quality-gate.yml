# Platform API quality gate: https://github.com/healthcare-org-app/healthcare-api-quality-gate
# Config: quality-gate.yml. Make the "gate / quality-gate" check required to block merges.
name: quality-gate

on:
  push:
    # main is judged by postman-cd.yml: two callers on the same ref would cancel each other (shared concurrency group).
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    uses: healthcare-org-app/healthcare-api-quality-gate/.github/workflows/gate.yml@v1
    secrets:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
