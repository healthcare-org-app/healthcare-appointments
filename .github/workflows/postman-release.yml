# A v* tag delivers a version. main already synchronised the workspace (postman-cd.yml), so the tag does not push again:
# it checks that the tag is legitimate, then smoke-tests the live API with the collection of the tagged commit.
# Runs in the "postman-prod" Environment (main and v* tags only).
name: postman-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: postman-prod
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_CLI_VERSION: 1.85.0
      API_BASE_URL: https://myhealthcare.dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the tag commit must be compared with origin/main

      # The Environment rule "v* tags" does not look at the branch: a tag pushed on a feature branch would get the secrets.
      - name: The tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

      # The tag is the version: v1.2.3 must match info.version of the spec.
      - name: The tag must match the spec version
        run: |
          SPEC_VERSION="$(sed -n 's/^  version: *//p' openapi.yaml | head -1 | tr -d "\"'")"
          if [ "$GITHUB_REF_NAME" != "v${SPEC_VERSION}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match info.version ${SPEC_VERSION} in openapi.yaml."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the Postman CLI
        run: npm install -g "postman-cli@${POSTMAN_CLI_VERSION}" --no-audit --no-fund

      # Read-only on the live API: only "List appointments". The other requests write (they publish Kafka events and
      # can free a slot), so they never run against this API.
      - name: Smoke test the live API (read-only)
        env:
          APPOINTMENTS_API_KEY: ${{ secrets.APPOINTMENTS_API_KEY }}
        run: |
          postman collection run "postman/collections/Appointments API" \
            -i "List appointments" \
            --env-var "baseUrl=${API_BASE_URL}" \
            --env-var "bearerToken=${APPOINTMENTS_API_KEY}"
