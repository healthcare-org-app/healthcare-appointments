services:
  appointments-service:
    build: .
    container_name: appointments_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      AUTH_DISABLED: "1"
      DATABASE_URL: postgresql://healthcare:healthcare_dev@postgres:5432/appointments
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_HOST_MODE: docker
      PORT_PATIENTS_SERVICE: "8100"
      PORT_PROVIDERS_SERVICE: "8200"
      PORT_APPOINTMENT_SLOTS_SERVICE: "8601"
      PORT_ROOM_BOOKING_SERVICE: "8604"
      PORT_NOTIFICATIONS_SERVICE: "9000"
      PORT_AUDIT_LOG_SERVICE: "8007"
      LOG_LEVEL: INFO
    ports:
      - "8600:8600"
    networks:
      - healthcare_net
    volumes:
      - ../../libs/py-healthcare-common:/opt/py-healthcare-common:ro
    command: >
      sh -c "cp -r /opt/py-healthcare-common /tmp/lib && pip install --quiet /tmp/lib && python -m app.main"
